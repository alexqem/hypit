name: Set up automation labels
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview missing labels without creating them
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
jobs:
  labels:
    if: github.repository == 'hypit-ai/hypit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node .github/automation/setup.mjs
          else
            node .github/automation/setup.mjs --apply
          fi
