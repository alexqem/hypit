name: Issue maintenance commands
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: hypit-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  command:
    if: >-
      github.repository == 'hypit-ai/hypit' &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Apply authorized maintenance command
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/automation/commands.mjs
