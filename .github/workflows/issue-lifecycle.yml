name: Reset waiting state after activity
on:
  issue_comment:
    types: [created]
  issues:
    types: [unlabeled]
  pull_request_target:
    types: [synchronize, unlabeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: hypit-issue-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reset:
    if: github.repository == 'hypit-ai/hypit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: node .github/automation/lifecycle.mjs
        env:
          GH_TOKEN: ${{ github.token }}
